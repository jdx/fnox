[env]
_.path = ["target/debug", "test/bats/bin"]

[tools]
# Pinned rather than "latest" because tak is the measuring instrument: an
# upgrade that changes how it samples would land in the series as a step change
# in fnox's numbers, indistinguishable from a real regression. Bump deliberately.
"github:jdx/tak" = "v0.0.5"
aube = "latest"
age = "latest"
"github:foresterre/cargo-msrv" = "latest"
cargo-binstall = "latest"
communique = "latest"
"cargo:cargo-edit" = "latest"
git-cliff = "latest"
hk = "latest"
pkl = "latest"
prettier = "latest"
shellcheck = "latest"
shfmt = "latest"
actionlint = "latest"
1password = "latest"
bitwarden = "latest"
bitwarden-secrets-manager = "latest"
vault = "latest"
"github:Infisical/cli" = "latest"
node = "24"

[tasks.test]
description = "Run both cargo and bats tests"
depends = ["test:cargo", "test:bats"]

[tasks."test:cargo"]
description = "Run cargo tests only"
run = "cargo test"

[tasks."test:bats"]
description = "Run bats tests only"
run = '''
filter_tags=""
if [ -n "$BATS_FILTER_TAGS" ]; then
  filter_tags="--filter-tags $BATS_FILTER_TAGS"
fi
if [ -n "$TRANCHE" ] && [ -n "$TRANCHE_COUNT" ]; then
  tests=$(ls -1 test/*.bats | sort | awk -v t=$TRANCHE -v n=$TRANCHE_COUNT 'NR % n == t')
  fnox exec -- bats --jobs 16 $filter_tags $tests
else
  fnox exec -- bats --jobs 16 $filter_tags {{arg(name='test', var=true, default='test')}}
fi
'''

[tasks."test:bats:fork"]
description = "Run bats tests simulating forked PR (no age key access)"
env = { FNOX_AGE_KEY = "/tmp/nonexistent-age-key.txt" }
run = "fnox exec -- bats --jobs 16 {{arg(name='test', var=true, default='test')}}"

[tasks.cargo-test]
description = "Run cargo tests only"
run = "cargo test"

[tasks.lint]
run = "hk check --all --slow"

[tasks.lint-fix]
run = "hk fix --all --slow"

[tasks.build]
description = "Build the project"
run = "cargo build"

[tasks.ci]
description = "Run full CI check (build, test, lint)"
depends = ["build", "test", "lint"]

[tasks.render]
description = "Render documentation from usage"
depends = ["render:*"]

[tasks."render:schema"]
description = "Generate JSON Schema for fnox configuration"
depends = ["build"]
run = [
  "fnox schema > docs/public/schema.json",
  "prettier --write docs/public/schema.json",
]

[tasks."render:usage"]
description = "Generate CLI documentation from usage"
depends = ["build", "build-usage"]
run = [
  "fnox usage > fnox.usage.kdl",
  "rm -rf docs/cli && mkdir -p docs/cli",
  "target/usage-cli/bin/usage g markdown -mf fnox.usage.kdl --out-dir docs/cli --url-prefix /cli",
  "target/usage-cli/bin/usage g json -f fnox.usage.kdl > docs/cli/commands.json",
  "prettier --write docs/cli",
]

[tasks.build-usage]
run = "cargo install --locked --git https://github.com/jdx/usage --rev 616fcfc3061957adc5ebddb05226ca97ae78f71f --root target/usage-cli usage-cli"
sources = ["Cargo.lock"]
outputs = ["target/usage-cli/bin/usage"]

# Instruction-counted benchmarks (see tak.toml). Needs valgrind for the counts;
# without it tak reports wall clock only and says so, so this still works on
# macOS where there is no usable cachegrind.
[tasks.perf]
dir = "{{config_root}}"
env = { TOKIO_WORKER_THREADS = "1" }
run = ["cargo build --release", "tak run"]

# Same measurement, appended to refs/notes/tak for this commit. Run by the
# `perf` workflow on every push to main; the notes are the history. Safe to run
# locally — nothing leaves the machine until `tak push`.
[tasks."perf:record"]
dir = "{{config_root}}"
env = { TOKIO_WORKER_THREADS = "1" }
run = ["cargo build --release", "tak run --record"]
