name: aube-lock

# Regenerates aube-lock.yaml on Renovate branches. Renovate's npm manager
# updates package.json but has no aube support, leaving the lockfile stale
# and breaking `aube install --frozen-lockfile` in CI. See
# jdx/renovate-config for the workflow implementation.

on:
  push:
    branches: ["renovate/**"]

permissions: {}

concurrency:
  # Not "aube-lock-<ref>": the called workflow uses that group for its own job.
  group: aube-lock-caller-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aube-lock:
    permissions:
      contents: write
    uses: jdx/renovate-config/.github/workflows/aube-lock.yml@f29cd6d5584e3acad48f18cc6eba09604a5bc6bf # v1.2.0
    secrets:
      AUBE_LOCK_APP_CLIENT_ID: Iv23ct0esfAqqzDuwjhI
      AUBE_LOCK_APP_PRIVATE_KEY: ${{ secrets.AUBE_LOCK_APP_PRIVATE_KEY }}
