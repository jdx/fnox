name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    tags: ["*"]
    branches: ["main"]

permissions: {}

jobs:
  trusted:
    if: ${{ github.actor == 'jdx' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'jdx')) }}
    permissions:
      contents: read
    uses: $/.github/workflows/ci-impl.yml
    with:
      trusted: true
    secrets:
      AGE_SECRET: ${{ secrets.AGE_SECRET }}

  untrusted:
    if: ${{ github.actor != 'jdx' || (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login != 'jdx')) }}
    permissions:
      contents: read
    uses: $/.github/workflows/ci-impl.yml
    with:
      trusted: false

  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false

  final:
    name: final
    if: ${{ always() && !cancelled() && needs.trusted.result != 'cancelled' && needs.untrusted.result != 'cancelled' && needs.zizmor.result != 'cancelled' }}
    permissions: {}
    needs: [trusted, untrusted, zizmor]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Check selected workflow result
        env:
          TRUSTED_RESULT: ${{ needs.trusted.result }}
          UNTRUSTED_RESULT: ${{ needs.untrusted.result }}
          ZIZMOR_RESULT: ${{ needs.zizmor.result }}
        run: |
          if [[ "$ZIZMOR_RESULT" == success ]] && {
               [[ "$TRUSTED_RESULT" == success && "$UNTRUSTED_RESULT" == skipped ]] ||
               [[ "$TRUSTED_RESULT" == skipped && "$UNTRUSTED_RESULT" == success ]]; }; then
            exit 0
          fi
          echo "trusted=$TRUSTED_RESULT untrusted=$UNTRUSTED_RESULT zizmor=$ZIZMOR_RESULT"
          exit 1
