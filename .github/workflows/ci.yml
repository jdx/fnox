name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    tags: ["*"]
    branches: ["main"]

permissions: {}

# ci-impl.yml has its own group, keyed on github.workflow and github.ref, so
# this one carries a different prefix: a shared group would make the called
# workflow wait for its own caller.
concurrency:
  group: ci-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  trusted:
    if: ${{ github.actor == 'jdx' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'jdx')) }}
    permissions:
      contents: read
    uses: $/.github/workflows/ci-impl.yml
    with:
      trusted: true
    secrets:
      AGE_SECRET: ${{ secrets.AGE_SECRET }}

  untrusted:
    if: ${{ github.actor != 'jdx' || (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login != 'jdx')) }}
    permissions:
      contents: read
    uses: $/.github/workflows/ci-impl.yml
    with:
      trusted: false

  # Pushes the timings that ci-other recorded on main. It is its own job so the
  # test jobs, which run pull request code, never hold a write token.
  cost:
    name: cost
    needs: trusted
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.trusted.result == 'success' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # `jouet cost push` pushes with it
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          cache: false
          install_args: jouet
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jouet-cost
          path: ${{ runner.temp }}
      - name: Push the timings
        run: |
          git fetch "$RUNNER_TEMP/jouet-cost.bundle" refs/notes/jouet-cost:refs/notes/jouet-cost
          jouet cost push

  final:
    name: final
    if: ${{ always() && !cancelled() && needs.trusted.result != 'cancelled' && needs.untrusted.result != 'cancelled' }}
    permissions: {}
    needs: [trusted, untrusted]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Check selected workflow result
        env:
          TRUSTED_RESULT: ${{ needs.trusted.result }}
          UNTRUSTED_RESULT: ${{ needs.untrusted.result }}
        run: |
          if [[ "$TRUSTED_RESULT" == success && "$UNTRUSTED_RESULT" == skipped ]] ||
             [[ "$TRUSTED_RESULT" == skipped && "$UNTRUSTED_RESULT" == success ]]; then
            exit 0
          fi
          echo "trusted=$TRUSTED_RESULT untrusted=$UNTRUSTED_RESULT"
          exit 1
