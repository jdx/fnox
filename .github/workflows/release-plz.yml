name: release-plz

permissions:
  pull-requests: write
  contents: write
  id-token: write # crates.io trusted publishing

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
      - release-plz

concurrency:
  group: release-plz

env:
  MBX_DISABLE: "1"
  DRY_RUN: 0

jobs:
  release-plz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # release-plz pushes tags and the release branch via `git push`, which needs the scoped
      # FNOX_GH_TOKEN persisted in the git config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.FNOX_GH_TOKEN }}
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libudev-dev pkg-config
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          experimental: true
          cache: false
      - run: mise trust --all
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: crates-io-auth
      - run: mise run release-plz
        env:
          GITHUB_TOKEN: ${{ secrets.FNOX_GH_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
