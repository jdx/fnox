name: Verification preview

on:
  pull_request:
    paths:
      - crates/fnox-core/native/touch-id-preview/**
      - test/native/touch-id-preview/**
      - .github/workflows/touch-id-preview*.yml
  push:
    branches: [main]
    paths:
      - crates/fnox-core/native/touch-id-preview/**
      - test/native/touch-id-preview/**
      - .github/workflows/touch-id-preview*.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26"
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: aube
      - name: Install script test dependencies
        run: aube install --frozen-lockfile
      - name: Check scripts
        run: node --test test/native/touch-id-preview/*.test.mts
      - name: Install Linux Qt
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y qt6-base-dev libqt6svg6-dev
      - name: Install Windows Qt
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install aqtinstall==3.3.0
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 --outputdir "$env:RUNNER_TEMP/qt"
          "CMAKE_PREFIX_PATH=$env:RUNNER_TEMP/qt/6.8.3/msvc2022_64" >> $env:GITHUB_ENV
          "$env:RUNNER_TEMP/qt/6.8.3/msvc2022_64/bin" >> $env:GITHUB_PATH
      - name: Configure
        run: cmake -S crates/fnox-core/native/touch-id-preview -B build/preview -DCMAKE_BUILD_TYPE=Debug
      - name: Build unsigned preview
        run: cmake --build build/preview --config Debug --target fnox-touch-id-preview --parallel 4
      - name: Check portable simulation
        if: runner.os != 'macOS'
        run: ctest --test-dir build/preview -C Debug --output-on-failure
