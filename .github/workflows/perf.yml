name: perf

# Records fnox's startup cost for every commit that lands on main, into the
# git-notes ref `refs/notes/tak`. The data lives in this repository — there is
# no external service holding it, and `git fetch origin refs/notes/tak:refs/notes/tak`
# gets you the whole history.
#
# Only runs post-merge. A PR-time gate is the eventual goal, but a gate needs a
# baseline series to compare against, and right now there is none. This builds
# that baseline.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions: {}

# Never two at once. Concurrent runs race the notes push; tak retries with a
# cat_sort_uniq merge so nothing is lost, but serialising avoids the churn.
# cancel-in-progress is off deliberately: every commit gets a measurement, and
# a cancelled run is a hole in the series.
concurrency:
  group: perf
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  TAK_RUNNER: jdx-perf-v1-ubuntu24.04-x64-fnox-rust1.97.1-tokio1
  # This is a new measurement series: the compiler, runner image and Tokio
  # worker count are part of the benchmark environment, not incidental details.

jobs:
  measure:
    name: Measure
    # Pin the image as well as tak and Rust. Absolute instruction counts shift
    # when any part of the measuring environment moves.
    runs-on: [self-hosted, jdx-perf-v1]
    container:
      image: ghcr.io/jdx/perf-runner@sha256:1b44fc9f1c93fc1b7a2db56a1ef743bbf8a8df60035121d455c9834fe8001922
      options: --cpuset-cpus 0-7
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Compile inside the pinned job container. Restoring target/ could relabel
      # a binary built on another runner class as a jdx-perf-v1 measurement.
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          cache: false
        env:
          MISE_LOCKED: "1"

      # cachegrind is the whole point: it counts instructions, which reproduce
      # to ~0.02% run-to-run where wall clock on this same hardware moves by
      # 4-20%. Without it tak still records timing, but the series stops being
      # precise enough to detect anything.
      # libudev and dbus are fnox's own build dependencies — hidapi will not
      # compile without them, the same set ci.yml and release-plz.yml install.
      # valgrind is tak's: cachegrind is what counts instructions, and it
      # reproduces to ~0.02% where wall clock on this hardware moves 4-20%.
      - name: Install build and measurement dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libdbus-1-dev libudev-dev pkg-config
          command -v valgrind || sudo apt-get install -y --no-install-recommends valgrind
          valgrind --version

      - name: Runner metadata
        run: |
          {
            echo '### Runner metadata'
            echo '```text'
            echo 'environment-revision: perf-runner@78e4231'
            echo 'image: ghcr.io/jdx/perf-runner@sha256:1b44fc9f1c93fc1b7a2db56a1ef743bbf8a8df60035121d455c9834fe8001922'
            uname -a
            lscpu
            mise --version
            rustc --version
            cargo --version
            valgrind --version
            for zone in /sys/class/thermal/thermal_zone*/temp; do
              [ -r "$zone" ] && printf '%s: %s\n' "$zone" "$(cat "$zone")"
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Measure and record
        run: |
          cargo build --release
          taskset -c 0-3 mise run perf:record
      - name: Package measurement note
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p /tmp/tak-out
          git notes --ref=tak show HEAD > /tmp/tak-out/note
          git rev-parse HEAD > /tmp/tak-out/sha

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: github.ref == 'refs/heads/main'
        with:
          name: tak-measurement
          path: /tmp/tak-out
          retention-days: 1
          if-no-files-found: error

      - name: Summary
        run: tak history >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish measurement note
    needs: measure
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: tak-measurement
          path: /tmp/tak-out

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Publish refs/notes/tak
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          sha=$(cat /tmp/tak-out/sha)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin refs/notes/tak:refs/notes/tak || true
          git notes --ref=tak add -f -F /tmp/tak-out/note "$sha"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPOSITORY}.git" refs/notes/tak
