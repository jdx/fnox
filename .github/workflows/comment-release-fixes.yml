name: comment release fixes
on: {release: {types: [published]}, workflow_dispatch: {inputs: {tag: {required: true, type: string}, dry_run: {required: false, type: boolean, default: true}}}}
jobs:
  comment:
    permissions: {contents: read, pull-requests: read, issues: write, discussions: write}
    uses: jdx/workflows/.github/workflows/comment-release-fixes.yml@d2274b273271f69e2f34909339a67cf4a47eca91
    with: {tag: '${{ inputs.tag || github.event.release.tag_name }}', marker_prefix: fnox-fixed-in, dry_run: '${{ inputs.dry_run || false }}'}
