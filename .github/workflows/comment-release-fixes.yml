name: comment release fixes
concurrency:
  group: comment-release-fixes-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false
on:
  {
    release: { types: [published] },
    workflow_dispatch:
      {
        inputs:
          {
            tag: { required: true, type: string },
            dry_run: { required: false, type: boolean, default: true },
          },
      },
  }
jobs:
  comment:
    permissions:
      { contents: read, pull-requests: read, issues: write, discussions: write }
    uses: jdx/workflows/.github/workflows/comment-release-fixes.yml@f06c20d10cd74d518af4338abf9877ceef81213a # v1.1.2
    with:
      tag: "${{ inputs.tag || github.event.release.tag_name }}"
      marker_prefix: fnox-fixed-in
      dry_run: ${{ inputs.dry_run || false }}
