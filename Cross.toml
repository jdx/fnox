[build.env]
# build.rs links the release executable non-PIE when this is set; cross
# otherwise filters it out at the container boundary.
passthrough = ["FNOX_NO_PIE"]

[target.x86_64-unknown-linux-gnu]
pre-build = [
    "apt-get update",
    "apt-get install -y libudev-dev",
]

[target.aarch64-unknown-linux-gnu]
pre-build = [
    "dpkg --add-architecture $CROSS_DEB_ARCH",
    "apt-get update",
    "apt-get install -y libudev-dev:$CROSS_DEB_ARCH",
]
