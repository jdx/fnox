[workspace]
members = [".", "crates/fnox-core"]
resolver = "3"

[workspace.package]
version = "1.33.1"
edition = "2024"
authors = ["@jdx"]
license = "MIT"
repository = "https://github.com/jdx/fnox"
# MSRV is kept deliberately behind latest-stable so fnox stays buildable from
# source by distro/nixpkgs packagers that provide an older, shared rustc. Do
# NOT raise this just to satisfy a dependency (e.g. an aws-sdk bump) — pin the
# dependency to an MSRV-compatible version instead. See AGENTS.md.
rust-version = "1.91.1"

[workspace.dependencies]
aes-gcm = "0.11.0-rc.3"
age = { version = "0.12", features = ["ssh", "plugin", "cli-common"] }
aho-corasick = "1"
anyhow = "1"
arboard = "3"
arc-swap = "1"
async-trait = "0.1"
atty = "0.2"
aws-config = { version = "1", features = ["sso", "credentials-process", "credentials-login"] }
aws-sdk-kms = { version = "1" }
aws-sdk-secretsmanager = { version = "1" }
aws-sdk-ssm = { version = "1" }
aws-sdk-sts = { version = "1" }
azure_core = { version = "1" }
azure_identity = { version = "1" }
azure_security_keyvault_keys = { version = "1" }
azure_security_keyvault_secrets = { version = "1" }
base64 = "0.23"
blake3 = "1"
bytes = "1"
chrono = "0.4"
ci_info = "0.14"
usage-rs = { git = "https://github.com/jdx/usage", rev = "88786493a5df2b90ad49314f68267c39c7497188", features = ["diagnostics"] }
console = "0.16"
crossterm = { version = "0.29", features = ["event-stream"] }
ctap-hid-fido2 = "3"
data-encoding = "2"
dbus = { version = "0.9", features = ["vendored"] }
demand = "2"
dirs = "6"
futures = "0.3"
gcp_auth = { version = "0.12" }
globset = "0.4"
google-cloud-kms = { version = "0.6" }
google-cloud-secretmanager-v1 = { version = "1" }
hex = "0.4"
hkdf = "0.13"
ignore = "0.4"
indexmap = { version = "2", features = ["serde"] }
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
keepass = { version = "0.13", features = ["save_kdbx4"] }
keeper-secrets-manager-core = { version = "17", default-features = false, features = ["blocking"] }
keyring-core = "1"
apple-native-keyring-store = { version = "1", features = ["keychain"] }
windows-native-keyring-store = "1"
dbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust", "vendored"] }
libc = "0.2"
libloading = "0.9"
miette = { version = "7", features = ["fancy"] }
miniz_oxide = "0.9"
nix = { version = "0.31", features = ["signal", "process"] }
openssl-sys = { version = "0.9", features = ["vendored"] }
pluralizer = "0.5"
proc-macro2 = "1"
quote = "1"
rand = "0.10"
ratatui = "0.30"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
rmcp = { version = "3", features = ["server", "transport-io", "macros"] }
rmp-serde = "1"
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std"] }
rustls-native-certs = "0.8"
schemars = { version = "1", features = ["indexmap2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_spanned = "1"
serde_yaml = "0.9"
sha2 = "0.11"
shellexpand = "3"
shlex = "2"
signal-hook = "0.4"
strsim = "0.11"
strum = { version = "0.28", features = ["derive"] }
tabled = { version = "0.21", features = ["ansi"] }
tempfile = "3"
tera = { version = "2", default-features = false }
terminal_size = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
toml_edit = { version = "0.25", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
urlencoding = "2"
walkdir = "2"
which = "8"
xx = { version = "2", features = ["fslock"] }

[package]
name = "fnox"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "A flexible secret management tool supporting multiple providers and encryption methods"
readme = "README.md"

[[bin]]
name = "fnox"
path = "src/main.rs"

[dependencies]
fnox-core = { path = "crates/fnox-core", version = "1" }

# Direct dependencies of the CLI binary (commands, MCP server, TUI, hook-env,
# shell integration). Provider/config/secret-resolver crates are pulled in
# transitively via fnox-core and are not listed here.
aho-corasick = { workspace = true }
anyhow = { workspace = true }
arboard = { workspace = true }
atty = { workspace = true }
base64 = { workspace = true }
blake3 = { workspace = true }
chrono = { workspace = true }
ci_info = { workspace = true }
usage-rs = { workspace = true }
console = { workspace = true }
crossterm = { workspace = true }
data-encoding = { workspace = true }
demand = { workspace = true }
globset = { workspace = true }
ignore = { workspace = true }
indexmap = { workspace = true }
libc = { workspace = true }
miette = { workspace = true }
miniz_oxide = { workspace = true }
nix = { workspace = true }
ratatui = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
rcgen = { workspace = true }
rmcp = { workspace = true }
rmp-serde = { workspace = true }
rustls = { workspace = true }
rustls-native-certs = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
shlex = { workspace = true }
signal-hook = { workspace = true }
strum = { workspace = true }
tabled = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true }
toml_edit = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
which = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[profile.dev]
debug = 1
