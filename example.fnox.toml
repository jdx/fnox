#:schema https://fnox.jdx.dev/schema.json
#
# Example fnox.toml. Full reference: https://fnox.jdx.dev/reference/configuration
#
# Every value below is safe to commit: age values are ciphertext, and
# provider values are references to items in a vault.

# Used by `fnox set` when --provider is not given.
default_provider = "age"

# Fail commands when a secret can't be resolved ("error" | "warn" | "ignore").
if_missing = "warn"

# Stop searching parent directories for more fnox.toml files.
# root = true

# Pull in shared settings. Paths are relative to this file.
# import = ["../shared/fnox.toml"]

# ---------------------------------------------------------------------------
# Providers: where values come from. The table name is yours to choose;
# `type` selects the backend. See https://fnox.jdx.dev/providers/overview
# ---------------------------------------------------------------------------

# Encrypt values into this file. Each recipient is a public key that may decrypt.
[providers.age]
type = "age"
recipients = [
  "age1...", # replace with your public key before running `fnox set`
]

# Read items from 1Password through the `op` CLI.
[providers.op]
type = "1password"
vault = "Development"

# ---------------------------------------------------------------------------
# Secrets for the default profile. The key is the environment variable name.
# ---------------------------------------------------------------------------
[secrets]

# Encrypted with age. `fnox set DATABASE_URL` writes the ciphertext.
DATABASE_URL = { provider = "age", value = "YWdlLWVuY3J5cHRpb24ub3JnL3YxCi0...", description = "Database connection string", if_missing = "error" }

# The `secret-key` field of the `Stripe` item in 1Password.
STRIPE_KEY = { provider = "op", value = "Stripe/secret-key" }

# A plaintext default for non-sensitive configuration.
NODE_ENV = { default = "development" }

# No provider or default: taken from the environment if set, otherwise skipped.
NPM_TOKEN = { description = "npm registry token", if_missing = "ignore" }

# Injected into `fnox exec` commands but not into an interactive shell.
SENTRY_DSN = { provider = "op", value = "Sentry/dsn", env = "exec", if_missing = "ignore" }

# Given to the command as a path to a temporary file instead of the value.
GOOGLE_APPLICATION_CREDENTIALS = { provider = "op", value = "GCP service account/key.json", as_file = true, if_missing = "ignore" }

# ---------------------------------------------------------------------------
# Profiles override the default profile. Select one with --profile or
# FNOX_PROFILE. Anything not overridden is inherited.
# ---------------------------------------------------------------------------

[profiles.staging.secrets]
DATABASE_URL = { provider = "age", value = "YWdlLWVuY3J5cHRpb24ub3JnL3YxCi0..." }
NODE_ENV = { default = "staging" }

# Production reads from AWS Secrets Manager.
[profiles.production.providers.aws]
type = "aws-sm"
region = "us-east-1"
prefix = "myapp/" # value = "database-url" reads the secret "myapp/database-url"

[profiles.production.secrets]
DATABASE_URL = { provider = "aws", value = "database-url", if_missing = "error" }
REDIS_URL = { provider = "aws", value = "redis-url", if_missing = "error" }
NODE_ENV = { default = "production" }

[profiles.ci.secrets]
DATABASE_URL = { default = "postgresql://localhost:5432/test" }
NODE_ENV = { default = "test" }
