# Plain provider - stores values as plain text in config, or reads them from a plaintext file
display_name = "Plain text"
serde_rename = "plain"
rust_variant = "Plain"
category = "Local"
description = "No encryption - stores values as plain text in config"
default_name = "plain"
setup_instructions = """
No setup required.
Secrets are stored as plain text in the config file.
Only use for non-sensitive data or testing."""

# Without `file`, secret values are returned as-is. With `file`, each secret's
# value names a key to look up in that file, parsed according to `format`.
[fields.file]
type = "optional"
placeholder = "secrets.env"
label = "File path:"
wizard = false

[fields.format]
type = "optional"
placeholder = "env"
label = "File format (env, shell, json, yaml, toml):"
wizard = false
