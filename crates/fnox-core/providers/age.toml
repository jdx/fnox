# Age encryption provider - modern encryption with public/private key pairs
display_name = "Age encryption"
serde_rename = "age"
rust_variant = "AgeEncryption"
category = "Local"
description = "Modern encryption tool - encrypts values with age keys"
default_name = "age"
setup_instructions = """
Age uses public/private key pairs for encryption.
Generate a key with: age-keygen -o ~/.config/fnox/age.txt"""

# Public keys, as an array or a table of name -> key (names are documentation only)
[fields.recipients]
type = "string_list_or_map"
wizard = false

[fields.key_file]
type = "optional"
placeholder = ""
label = "Key file path (optional):"
wizard = false

[fields.identity]
type = "provider_ref"
wizard = false

# Named identities (name -> key file path or `{ provider, value }` reference), selected with `default_identity` or FNOX_AGE_IDENTITY
[fields.identities]
type = "string_or_provider_ref_map"

[fields.default_identity]
type = "optional"
placeholder = ""
label = "Default identity name (optional):"
wizard = false

# TODO: Remove wizard_fields and have the wizard support vec_string fields directly
# Currently uses a simplified 'recipient' field (singular) that maps to recipients[0]
[wizard_fields.recipient]
type = "required"
placeholder = "age1..."
label = "Age public key (recipient):"
