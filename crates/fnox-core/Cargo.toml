aws-sdk-kms = { workspace = true, optional = true }
aws-sdk-secretsmanager = { workspace = true, optional = true }
aws-sdk-ssm = { workspace = true, optional = true }
aws-sdk-sts = { workspace = true, optional = true }
azure_core = { workspace = true, optional = true }
azure_identity = { workspace = true, optional = true }
azure_security_keyvault_keys = { workspace = true, optional = true }
azure_security_keyvault_secrets = { workspace = true, optional = true }
base64 = { workspace = true }
blake3 = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
usage-rs = { workspace = true }
demand = { workspace = true }
dirs = { workspace = true }
fnox-client = { workspace = true }
futures = { workspace = true }
gcp_auth = { workspace = true, optional = true }
google-cloud-kms = { workspace = true, optional = true }
google-cloud-secretmanager-v1 = { workspace = true, optional = true }
hex = { workspace = true }
hkdf = { workspace = true }
hmac = { workspace = true }
indexmap = { workspace = true }
jsonwebtoken = { workspace = true }
k8s-openapi = { workspace = true, optional = true }
keepass = { workspace = true }
keeper-secrets-manager-core = { workspace = true, optional = true }
keyring-core = { workspace = true }
kube = { workspace = true, optional = true }
libloading = { workspace = true }
mlua = { workspace = true }
miette = { workspace = true }
pluralizer = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
rpassword = { workspace = true }
rust-embed = { workspace = true }
rusqlite = { workspace = true, optional = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_spanned = { workspace = true }
serde_yaml = { workspace = true }
sha2 = { workspace = true }
shellexpand = { workspace = true }
shlex = { workspace = true }
