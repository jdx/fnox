# ctap-hid-fido2 → hidapi → libudev cannot be statically linked on musl,
# so the FIDO2 provider is excluded from musl builds even with the `fido2`
# feature on.
[target.'cfg(not(target_env = "musl"))'.dependencies]
ctap-hid-fido2 = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
dbus = { workspace = true }
dbus-secret-service-keyring-store = { workspace = true }
openssl-sys = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { workspace = true }

[build-dependencies]
cc = { workspace = true }
indexmap = { workspace = true }
proc-macro2 = { workspace = true }
quote = { workspace = true }
serde = { workspace = true }
