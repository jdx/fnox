[package]
name = "fnox-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Provider library and core types for fnox"
readme = "../../README.md"

[features]
# Every provider is built by default. Each feature below adds a provider family
# whose SDK is large or needs a system library; turn them off with
# `--no-default-features` and add back the ones you use. Provider and lease
# types stay known in every build, so a config that names a left-out one still
# loads, and using it fails with an error that names the missing feature.
default = ["aws", "azure", "enpass", "fido2", "gcp", "keeper", "kubernetes"]
# aws-kms, aws-ps and aws-sm providers, aws-sts lease backend
aws = ["dep:aws-config", "dep:aws-sdk-kms", "dep:aws-sdk-secretsmanager", "dep:aws-sdk-ssm", "dep:aws-sdk-sts"]
# azure-ac, azure-kms and azure-sm providers, azure-token lease backend,
# azure-container-apps push target
azure = ["dep:azure_core", "dep:azure_identity", "dep:azure_security_keyvault_keys", "dep:azure_security_keyvault_secrets"]
# enpass provider (SQLCipher and a vendored OpenSSL, compiled from C)
enpass = ["dep:rusqlite", "dep:openssl-sys"]
# fido2 provider. Needs libudev on Linux at build and run time, and is never
# built for Linux musl targets.
fido2 = ["dep:ctap-hid-fido2"]
# gcp-kms and gcp-sm providers, gcp-iam lease backend (pulls in a vendored
# OpenSSL on Linux)
gcp = ["dep:gcp_auth", "dep:google-cloud-kms", "dep:google-cloud-secretmanager-v1", "dep:openssl-sys"]
# keeper-sm provider
keeper = ["dep:keeper-secrets-manager-core"]
# kubernetes provider and lease backend
kubernetes = ["dep:k8s-openapi", "dep:kube"]

